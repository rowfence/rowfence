# The OpenSSF Scorecard: what an outside reader checks first about how a project is run (actions pinned by commit,
# what each workflow's token may do, known vulnerabilities in what it depends on, fuzzing, review, releases).
# Every Monday, on each push to main, and by hand. The score and each check's reason are in the run's files
# (scorecard.json); what a check finds is listed under Security, Code scanning. Nothing is published to
# scorecard.dev: `publish_results` would do that, and the badge needs it.
# On GitHub's own runner whatever the repository variable RUNNER says: publishing takes nothing else.
name: scorecard
on:
  schedule:
    - cron: "30 5 * * 1"       # Mondays, 05:30 UTC
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: scorecard
  cancel-in-progress: true
# what a job needs beyond reading the repository, it says itself
permissions: {contents: read}
jobs:
  scorecard:
    runs-on: ubuntu-latest
    permissions: {contents: read, actions: read, security-events: write}   # security-events: the findings' list
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: {persist-credentials: false}
      # twice: the score is only in the JSON, and Code scanning only takes SARIF
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc   # v2.4.4
        with: {results_file: scorecard.json, results_format: json, publish_results: false}
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc   # v2.4.4
        with: {results_file: scorecard.sarif, results_format: sarif, publish_results: false}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
        with: {name: scorecard, path: "scorecard.*", retention-days: 30}
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2   # v4.38.2
        with: {sarif_file: scorecard.sarif}
