# The docs site on GitHub Pages (rowstile.dev), built from a release tag so it shows what was released. A tag
# deploys it when that release becomes what a plain install gets (npm's `latest`), or while no final release exists
# yet; an alpha or a candidate after one doesn't. Run by hand, it deploys the tag it is given:
#   gh workflow run site.yml -f tag=v0.1.0
name: site
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag: {description: "the release tag to build the site from (v0.1.0)", required: true}
permissions: {contents: read}
concurrency: {group: pages, cancel-in-progress: false}
jobs:
  build:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    outputs:
      deploy: ${{ steps.which.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: {ref: "${{ inputs.tag || github.ref_name }}", fetch-depth: 0}
      - id: which
        env:
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          tag=$(python3 packaging/version.py --dist-tag)
          finals=$(git tag -l 'v*' | grep -cE '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)
          if [ "$MANUAL" = true ] || [ "$tag" = latest ] || { [ "$tag" = next ] && [ "$finals" = 0 ]; }; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::npm's $tag: the site stays at the release a plain install gets"
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020   # v7.0.0
        with: {node-version: "24"}
      - run: cd site && npm ci --no-audit --no-fund && node build.mjs
      - if: steps.which.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9   # v5.0.0
        with: {path: site/dist/}

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions: {pages: write, id-token: write}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346   # v5.0.1
