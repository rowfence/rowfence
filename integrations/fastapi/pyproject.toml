[project]
name = "rowstile-conformance-fastapi"
version = "0.0.0"
description = "The Python SDK's conformance suite: a small FastAPI app on SQLAlchemy (async, asyncpg), migrated with Alembic"
requires-python = ">=3.11"
dependencies = [
  "rowstile[fastapi,sqlalchemy,psycopg,asyncpg]",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "psycopg[binary]>=3.1",
  "alembic>=1.13",
  "fastapi>=0.110",
  "httpx>=0.27",
  "pytest>=8",
  "mypy>=1.10",
]

[tool.uv]
package = false

[tool.uv.sources]
rowstile = {path = "../../sdk/python", editable = true}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# strongly typed, as the repository's Python (ty.toml): uv sync, then uvx ty@0.0.56 check --project integrations/fastapi
[tool.ty.environment]
python-version = "3.11"
python = ".venv"

[tool.ty.rules]
all = "error"
missing-override-decorator = "ignore"
